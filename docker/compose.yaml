# Watches on TrueNAS: Apps › Discover Apps › Custom App › Install via YAML. docs/SELF_HOSTING.md has
# the steps. First make the four datasets below, owned by the apps user (568), and change
# /mnt/tank to your pool's path. Also works with `docker compose up -d` on any Linux machine.
services:
  watches:
    # A version (such as :0.9.0) rather than latest keeps updates in your hands.
    image: ghcr.io/tunlezah/watches:latest
    restart: unless-stopped
    ports:
      # The web page. Open https://<your-nas>:5800 and accept its self-signed certificate.
      - "5800:5800"
    environment:
      # TrueNAS's apps user: it owns the datasets.
      USER_ID: "568"
      GROUP_ID: "568"
      # Your time zone, for the times in backups' names.
      TZ: "Etc/UTC"
      # A login in front of the app, over HTTPS. Choose your own password.
      SECURE_CONNECTION: "1"
      WEB_AUTHENTICATION: "1"
      WEB_AUTHENTICATION_USERNAME: "watches"
      WEB_AUTHENTICATION_PASSWORD: "change-me"
      # Upload and download files from the web page, in these two folders only.
      WEB_FILE_MANAGER: "1"
      WEB_FILE_MANAGER_ALLOWED_PATHS: "/backups,/import"
    volumes:
      - /mnt/tank/apps/watches/data:/data        # the collection
      - /mnt/tank/apps/watches/backups:/backups  # backup files
      - /mnt/tank/apps/watches/import:/import    # photos and documents on their way in
      - /mnt/tank/apps/watches/config:/config    # the web page's own settings and certificate
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
