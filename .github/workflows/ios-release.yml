name: iOS release

# Signs the iPhone app and uploads it to TestFlight, on version tags and on demand.
#
# Without the signing secrets (see README › iPhone › Signing and TestFlight) it still builds and
# checks an unsigned Release archive, so the release path stays tested before the Apple account
# exists. Nothing is uploaded then.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SIGNED: ${{ secrets.IOS_DIST_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # App Store Connect only accepts builds made with a recent SDK (Xcode 26 and the iOS 26 SDK).
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::This runner has no Xcode 26, which App Store Connect requires."; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # TestFlight needs a new build number for every upload: version.xcconfig's, then the run number.
      - name: Build number
        run: |
          BASE=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' version.xcconfig)
          echo "BUILD_NUMBER=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Build number $BASE.${{ github.run_number }}"

      - name: Install the signing certificate, profile and App Store Connect key
        if: env.SIGNED == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$UUID.mobileprovision"
          done

          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive, signed
        if: env.SIGNED == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          xcodebuild archive
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/Watches.xcarchive"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          DEVELOPMENT_TEAM="$TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Archive, unsigned (no signing secrets yet)
        if: env.SIGNED != 'true'
        run: >
          xcodebuild archive
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/Watches.xcarchive"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          CODE_SIGNING_ALLOWED=NO

      - name: Privacy manifest covers the binary
        run: python3 tools/check-privacy-symbols.py "$RUNNER_TEMP/Watches.xcarchive" iosApp/iosApp/PrivacyInfo.xcprivacy

      - name: Upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.tunlezah.watches</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Watches.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build $BUILD_NUMBER uploaded. It appears in TestFlight once App Store Connect has processed it."

      - name: Say what happened without the secrets
        if: env.SIGNED != 'true'
        run: echo "::notice::No signing secrets, so this built and checked an unsigned Release archive (build $BUILD_NUMBER). Nothing was uploaded."

      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.mobileprovision"

      - name: Keep the debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms
          path: ${{ runner.temp }}/Watches.xcarchive/dSYMs
          retention-days: 14
          if-no-files-found: ignore
