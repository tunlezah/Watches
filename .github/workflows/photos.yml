name: Photos

# The shared data tests on an Android emulator. Above all that is the photo conformance suite
# (docs/MACOS_PLAN.md, 9.4): the same photos and the same expected results as on the iPhone
# simulator, the Mac and Linux, here against Android's own decoders, which no desktop stand-in has.
# The repositories, backups and restores run too, on Android's real file system and SQLite.
# It runs when the data or core code changes, on version tags, and on demand.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "shared/data/**"
      - "shared/core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/photos.yml"
  pull_request:
    paths:
      - "shared/data/**"
      - "shared/core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/photos.yml"
  workflow_dispatch:

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Built before the emulator starts, so a compile error doesn't cost an emulator boot.
      - name: Build the tests
        run: ./gradlew --stacktrace :shared:data:assembleAndroidDeviceTest

      # Without this the emulator runs unaccelerated, and takes many times as long.
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Shared data tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --stacktrace :shared:data:connectedAndroidDeviceTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: |
            shared/data/build/reports/androidTests/
            shared/data/build/outputs/androidTest-results/
          retention-days: 14
