name: iOS

# macOS minutes count ten times against a private repo's free allowance, so this runs when
# iOS-specific code or the build changes, on version tags, and on demand. Shared Kotlin is still
# compiled for iOS on every push by the Android workflow (main and test code).
on:
  push:
    branches: ["**"]
    # Tags skip the path filter, so a version tag always gets an iOS build.
    tags: ["v*"]
    paths:
      - "iosApp/**"
      - "shared/*/src/iosMain/**"
      - "shared/*/src/iosTest/**"
      - "shared/*/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "version.xcconfig"
      - "tools/check-privacy-symbols.py"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iosApp/**"
      - "shared/*/src/iosMain/**"
      - "shared/*/src/iosTest/**"
      - "shared/*/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "version.xcconfig"
      - "tools/check-privacy-symbols.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's toolchain and the simulator builds of every library (Compose, Skia, Room...).
      # Without them the first link takes 15 minutes or more, so they're saved as soon as linking
      # has worked, even if a later step fails.
      - name: Restore the Kotlin/Native cache
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The same Xcode as the release build: App Store Connect only takes builds made with a recent SDK.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; else echo "::warning::No Xcode 26 on this runner; using the default."; fi
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); raise SystemExit
          ')
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      # One module at a time: linking for the simulator needs a lot of memory on a 7 GB runner.
      - name: Link the shared test binaries
        id: link
        timeout-minutes: 45
        run: >
          ./gradlew --max-workers=1 --stacktrace
          :shared:core:linkDebugTestIosSimulatorArm64
          :shared:data:linkDebugTestIosSimulatorArm64
          :shared:search:linkDebugTestIosSimulatorArm64
          :shared:ui:linkDebugTestIosSimulatorArm64

      - name: Save the Kotlin/Native cache
        if: steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      # One module per step, so no two run on the simulator at once and a stuck one can't hold the
      # runner for long. Each runs even if an earlier one failed, so one run shows every failure.
      - name: Shared tests on the simulator (core)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        timeout-minutes: 10
        run: ./gradlew --stacktrace :shared:core:iosSimulatorArm64Test -PiosSimulator="$UDID"

      - name: Shared tests on the simulator (data)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        timeout-minutes: 10
        run: ./gradlew --stacktrace :shared:data:iosSimulatorArm64Test -PiosSimulator="$UDID"

      - name: Shared tests on the simulator (search)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        timeout-minutes: 10
        run: ./gradlew --stacktrace :shared:search:iosSimulatorArm64Test -PiosSimulator="$UDID"

      - name: Shared tests on the simulator (ui)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        timeout-minutes: 10
        run: ./gradlew --stacktrace :shared:ui:iosSimulatorArm64Test -PiosSimulator="$UDID"

      # Builds the app, then runs the tests hosted in it (iosAppTests) and the UI tests (iosAppUITests).
      - name: Build the app and run its tests on the simulator
        id: app
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        timeout-minutes: 30
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination "id=$UDID"
          -derivedDataPath build/ios
          -resultBundlePath build/ios/tests.xcresult
          CODE_SIGNING_ALLOWED=NO
          test

      # The app is built even when one of its tests fails, so these still run then.
      - name: Privacy manifest covers the binary
        if: ${{ !cancelled() && steps.app.outcome != 'skipped' }}
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 3 -name "iosApp.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::The app wasn't built."; exit 1; fi
          python3 tools/check-privacy-symbols.py "$APP" iosApp/iosApp/PrivacyInfo.xcprivacy

      - name: Launch and screenshot
        if: ${{ !cancelled() && steps.app.outcome != 'skipped' }}
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 3 -name "iosApp.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::The app wasn't built."; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" io.github.tunlezah.watches
          sleep 25
          xcrun simctl io "$UDID" screenshot ios-launch.png
          # Fail if the app is no longer running (it crashed after launch).
          xcrun simctl spawn "$UDID" launchctl list | grep io.github.tunlezah.watches

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: ios-launch.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/ios/tests.xcresult
            shared/*/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
