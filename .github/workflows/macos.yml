name: macOS

# Packages the Mac app as a disk image and checks it, and runs the tests of the code the Mac shares
# with the iPhone (Apple's image code) on the Mac itself. macOS minutes count ten times against a
# private repo's free allowance, so this runs when the Mac shell, that shared code or the build
# changes, on version tags, and on demand. Everything else about the Mac app (compiling, tests,
# screenshots, the self-test of a packaged build) runs on Linux on every push, in the Android workflow.
on:
  push:
    branches: ["**"]
    # Tags skip the path filter, so a version tag always gets a disk image.
    tags: ["v*"]
    paths:
      - "desktopApp/**"
      - "macBridge/**"
      - "shared/*/src/jvmMain/**"
      - "shared/*/src/appleMain/**"
      - "shared/*/src/appleTest/**"
      - "shared/data/src/commonMain/**/photos/**"
      - "shared/data/src/commonTest/**"
      - "shared/*/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "version.xcconfig"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "macBridge/**"
      - "shared/*/src/jvmMain/**"
      - "shared/*/src/appleMain/**"
      - "shared/*/src/appleTest/**"
      - "shared/data/src/commonMain/**/photos/**"
      - "shared/data/src/commonTest/**"
      - "shared/*/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "version.xcconfig"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # An Apple silicon runner: the disk image is for Apple silicon Macs, and jpackage builds for the
    # machine it runs on.
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's toolchain and the Mac builds of the libraries the shared data code uses.
      - name: Restore the Kotlin/Native cache
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-mac-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The photo conformance suite (docs/MACOS_PLAN.md, 9.4) and the rest of the shared data tests,
      # against Apple's image code as the Mac runs it. No simulator: these run on the Mac itself.
      - name: Shared data tests on the Mac
        run: ./gradlew --stacktrace :shared:data:macosArm64Test

      # The bridge (docs/MACOS_PLAN.md, 8.2.6): that same image code as a native library, which is how
      # the Mac app, running on Java, reaches it.
      - name: Build the Mac bridge
        run: ./gradlew --stacktrace :macBridge:linkReleaseSharedMacosArm64

      - name: Check the bridge
        run: |
          LIB="$PWD/macBridge/build/bin/macosArm64/releaseShared/libwatchesbridge.dylib"
          ls -la "$LIB"
          file "$LIB" | grep -q arm64 || { echo "::error::The bridge isn't built for Apple silicon"; exit 1; }
          # Its whole surface is these C functions.
          nm -gU "$LIB" | grep " _watches_" || { echo "::error::The bridge exports none of its functions"; exit 1; }
          otool -L "$LIB"
          echo "WATCHES_BRIDGE=$LIB" >> "$GITHUB_ENV"

      # The shared data tests once more, this time on Java with the bridge loaded, which is exactly how
      # the Mac app handles a photo: the conformance suite, HEIC included, through JNA into the library.
      # MacBridgeTest fails if they ran on the plain-Java codec instead.
      - name: Shared data tests through the bridge
        run: |
          ./gradlew --stacktrace :shared:data:jvmTest
          grep -h -o "MacBridgeTest: the tests ran on Apple's codec[^<]*" shared/data/build/test-results/jvmTest/*.xml \
            || { echo "::error::The JVM tests didn't run through the bridge"; exit 1; }

      - name: Save the Kotlin/Native cache
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: Package the disk image
        run: ./gradlew --stacktrace :desktopApp:packageDmg

      # jpackage writes what went wrong to files of its own, not to the build's output.
      - name: Show the packaging tool's logs
        if: failure()
        run: |
          for f in desktopApp/build/compose/logs/*/*.txt; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      # The self-test runs inside the app on the disk image, which is the thing that gets installed:
      # the launcher, the trimmed Java runtime and the native libraries, as packaged.
      - name: Mount the disk image
        run: |
          DMG=$(ls desktopApp/build/compose/binaries/main/dmg/*.dmg)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/Watches"
          ls -la "$RUNNER_TEMP/Watches"
          echo "APP=$RUNNER_TEMP/Watches/Watches.app" >> "$GITHUB_ENV"

      - name: Self-test of the packaged app
        run: |
          "$APP/Contents/MacOS/Watches" --self-test "$RUNNER_TEMP/self-test" > "$RUNNER_TEMP/self-test.txt" 2>&1 || { cat "$RUNNER_TEMP/self-test.txt"; exit 1; }
          cat "$RUNNER_TEMP/self-test.txt"
          # The packaged app must have found its bridge and put a HEIC through it.
          grep -q "photos ok (the Mac's own image code, through the bridge; .*located.heic" "$RUNNER_TEMP/self-test.txt" \
            || { echo "::error::The packaged app didn't handle photos through the Mac bridge"; exit 1; }

      - name: Check the bundle
        run: |
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' version.xcconfig)
          BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' version.xcconfig)
          # jpackage refuses a bundle version that starts with 0, so until 1.0.0 the bundle carries
          # 1.0.<build> (desktopApp/build.gradle.kts). The app itself reports the real version.
          case "$VERSION" in 0.*) BUNDLE_VERSION="1.0.$BUILD" ;; *) BUNDLE_VERSION="$VERSION" ;; esac
          PLIST="$APP/Contents/Info.plist"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          FAIL=0
          expect() { if [ "$2" != "$3" ]; then echo "::error::$1 is '$2', expected '$3'"; FAIL=1; else echo "$1: $2"; fi; }
          expect "Bundle ID" "$(plist CFBundleIdentifier)" "io.github.tunlezah.watches.mac"
          expect "Bundle version" "$(plist CFBundleShortVersionString)" "$BUNDLE_VERSION"
          expect "Build" "$(plist CFBundleVersion)" "$BUILD"
          expect "Minimum macOS" "$(plist LSMinimumSystemVersion)" "13.0"
          file "$APP/Contents/MacOS/Watches" | grep -q arm64 || { echo "::error::The launcher isn't built for Apple silicon"; FAIL=1; }
          BRIDGE=$(find "$APP" -name libwatchesbridge.dylib)
          [ -n "$BRIDGE" ] && echo "Bridge: ${BRIDGE#$APP/} ($(du -h "$BRIDGE" | cut -f1))" || { echo "::error::The app carries no Mac bridge"; FAIL=1; }
          # An Apple silicon Mac runs nothing unsigned. Without a Developer ID the bundle is signed ad hoc.
          codesign --verify --deep --strict --verbose=2 "$APP" || { echo "::error::The app's signature doesn't verify"; FAIL=1; }
          codesign --display --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/signature.txt"
          du -sh "$APP"
          exit $FAIL

      - name: Unmount the disk image
        if: always()
        run: hdiutil detach "$RUNNER_TEMP/Watches" || true

      # Named for its version, like the APK. "not-notarised" until the build is signed with a
      # Developer ID and notarised (docs/MACOS_PLAN.md, 8.4.3): macOS then needs one extra step to
      # open it (README › Mac).
      - name: Name the disk image
        id: name
        run: |
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' version.xcconfig)
          BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' version.xcconfig)
          mkdir -p dist
          cp "$DMG" "dist/Watches-$VERSION-$BUILD-not-notarised.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Watches-$VERSION-$BUILD-not-notarised.dmg"
            echo "For Apple silicon Macs on macOS 13 or later. Signed ad hoc, not notarised: the first time, macOS refuses to open it until you allow it in System Settings › Privacy & Security › Open Anyway."
            echo '```'
            grep -E "^(Identifier|Format|Signature|TeamIdentifier)" "$RUNNER_TEMP/signature.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: watches-mac-dmg
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Upload the self-test's drawing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-self-test
          path: ${{ runner.temp }}/self-test/self-test.png
          retention-days: 14

  # Adds the disk image to the GitHub release for a v* tag, beside the APK. The Android workflow
  # creates that release, with the changelog entry as its notes, once its own build has finished,
  # so this waits for it. A job of its own, on Linux: waiting costs nothing there, and only these
  # steps can write to the repository.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Tag matches the app's version
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "${TAG_VERSION%%-*}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.xcconfig ($VERSION)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: watches-mac-dmg
          path: dist

      - name: Add the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
              echo "::notice::Added the Mac disk image to $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
              exit 0
            fi
            sleep 30
          done
          echo "::error::No release for $GITHUB_REF_NAME after 45 minutes. Once the Android workflow has published it, run this workflow again on the tag."
          exit 1
