name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WATCHES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/watches-release.jks"
            echo "WATCHES_KEYSTORE=$RUNNER_TEMP/watches-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: the release APK will be unsigned."
          fi

      - name: Checks, tests and release build
        env:
          WATCHES_KEYSTORE_PASSWORD: ${{ secrets.WATCHES_KEYSTORE_PASSWORD }}
          WATCHES_KEY_ALIAS: ${{ secrets.WATCHES_KEY_ALIAS }}
          WATCHES_KEY_PASSWORD: ${{ secrets.WATCHES_KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace
          checkNetworkIsolation
          :shared:core:jvmTest
          :shared:data:jvmTest
          :shared:search:jvmTest
          :shared:ui:compileKotlinIosSimulatorArm64
          :androidApp:recordRoborazziDebug
          :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watches-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: androidApp/build/outputs/roborazzi/*.png
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 14
