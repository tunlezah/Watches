name: Android

# Checks, tests and a signed release APK on every push. Without the signing secrets (docs/BUILD.md › Release
# APK and signing) it's signed with the run's throwaway debug key: it installs, but not over an
# earlier build. On a v* tag the APK is also published as a GitHub release.
#
# The Mac app is checked here too, because its code runs on Linux: it is compiled, tested, drawn in
# every design and packaged with a trimmed Java runtime, which then runs the app's self-test. Only
# the Mac disk image itself needs a Mac (the macOS workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      key: ${{ steps.apk.outputs.key }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WATCHES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/watches-release.jks"
            echo "WATCHES_KEYSTORE=$RUNNER_TEMP/watches-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: the release APK is signed with this run's throwaway debug key."
          fi

      - name: Checks, tests and release build
        env:
          WATCHES_KEYSTORE_PASSWORD: ${{ secrets.WATCHES_KEYSTORE_PASSWORD }}
          WATCHES_KEY_ALIAS: ${{ secrets.WATCHES_KEY_ALIAS }}
          WATCHES_KEY_PASSWORD: ${{ secrets.WATCHES_KEY_PASSWORD }}
        # The shared tests run here on the JVM; their iOS builds are compiled too, so an iOS-only
        # mistake shows up without waiting for the iOS workflow (which runs them on the simulator).
        run: >
          ./gradlew --stacktrace
          checkNetworkIsolation
          checkIosProject
          :shared:core:jvmTest
          :shared:data:jvmTest
          :shared:search:jvmTest
          :shared:ui:testAndroidHostTest
          :shared:ui:jvmTest
          :desktopApp:test
          :desktopApp:createDistributable
          :shared:ui:compileKotlinIosSimulatorArm64
          :shared:core:compileTestKotlinIosSimulatorArm64
          :shared:data:compileTestKotlinIosSimulatorArm64
          :shared:search:compileTestKotlinIosSimulatorArm64
          :shared:ui:compileTestKotlinIosSimulatorArm64
          :shared:data:compileTestKotlinMacosArm64
          :macBridge:compileKotlinMacosArm64
          :androidApp:recordRoborazziDebug
          :androidApp:assembleRelease

      # Gives the APK a name that carries its version, checks its signature, and says on the run's page
      # which key signed it. A throwaway debug key means it won't install over an earlier build.
      - name: Name and check the APK
        id: apk
        shell: bash
        run: |
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' version.xcconfig)
          BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' version.xcconfig)
          OUT=androidApp/build/outputs/apk/release
          mkdir -p dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f "$OUT/androidApp-release.apk" ]; then
            APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            # Fails the step if the signature doesn't verify.
            "$APKSIGNER" verify --print-certs "$OUT/androidApp-release.apk" > "$RUNNER_TEMP/certs.txt"
            CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1)
            cp "$OUT/androidApp-release.apk" "dist/Watches-$VERSION-$BUILD.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # The decode step sets WATCHES_KEYSTORE only when the signing secret exists.
            if [ -n "${WATCHES_KEYSTORE:-}" ]; then
              echo "key=release" >> "$GITHUB_OUTPUT"
              echo "Signed APK \`Watches-$VERSION-$BUILD.apk\`. Certificate SHA-256: \`$CERT\` (the same for every build signed with your key)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "key=debug" >> "$GITHUB_OUTPUT"
              echo "Signed APK \`Watches-$VERSION-$BUILD.apk\`, with this run's throwaway debug key (certificate SHA-256 \`$CERT\`). It installs, but not over an earlier build: in the app, back up (Settings › Backup & restore), uninstall it, install this APK, then restore." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Signed with this run's throwaway debug key: to install it, uninstall the earlier build first (back up your collection in Settings › Backup & restore, then restore it)."
            fi
          else
            cp "$OUT/androidApp-release-unsigned.apk" "dist/Watches-$VERSION-$BUILD-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The APK is unsigned, so Android won't install it. androidApp/build.gradle.kts should sign release builds with the debug key when there's no release key."
          fi

      # The app removes a photo's location with its own code, and the shared tests keep the photos
      # they cleaned. Pillow, which shares no code with the app, reads them back: no location, the
      # dates kept, the pictures untouched.
      - name: Independent check of location removal
        run: |
          python3 -m venv "$RUNNER_TEMP/photo-check"
          "$RUNNER_TEMP/photo-check/bin/pip" install --quiet pillow pillow-heif
          "$RUNNER_TEMP/photo-check/bin/python" tools/photo_fixtures.py check shared/data/build/outputs/cleaned-photos

      # The packaged desktop app carries its own Java runtime, cut down to the modules it's thought to
      # need. A missing one shows only when the app runs, so the app is run: it starts its wiring, makes
      # a collection, backs it up and restores it, and draws a frame.
      - name: Self-test of the packaged desktop app
        run: desktopApp/build/compose/binaries/main/app/Watches/bin/Watches --self-test "$RUNNER_TEMP/desktop-self-test"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watches-release-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: androidApp/build/outputs/roborazzi/*.png
          retention-days: 14

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: desktopApp/build/outputs/screenshots/*.png
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 14

  # Publishes the signed APK on a v* tag, with that version's changelog entry as the notes. A job of
  # its own, so only these steps, not the build, can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refuse an unsigned APK
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::The APK is unsigned, so Android wouldn't install it. Fix the build's signing, then run this workflow again on the tag."
          exit 1

      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Tag matches the app's version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "${TAG_VERSION%%-*}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.xcconfig ($VERSION). Bump MARKETING_VERSION and CURRENT_PROJECT_VERSION there, then tag that commit v<version>."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: watches-release-apk
          path: dist

      # Run again on the same tag, it replaces the APK on the existing release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          KEY: ${{ needs.build.outputs.key }}
        run: |
          if [ "$KEY" = "debug" ]; then
            printf '%s\n\n' "Signed with a throwaway debug key, so it won't install over an earlier build. In the app, back up your collection (Settings › Backup & restore), uninstall it, install this APK, then restore." > "$RUNNER_TEMP/notes.md"
          fi
          awk -v head="## $VERSION" '
            /^## / { inside = ($0 == head || index($0, head ":") == 1 || index($0, head " ") == 1); next }
            inside { print }
          ' CHANGELOG.md >> "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            FLAGS=()
            if [ -s "$RUNNER_TEMP/notes.md" ]; then FLAGS+=(--notes-file "$RUNNER_TEMP/notes.md"); else FLAGS+=(--generate-notes); fi
            # A tag such as v0.7.0-rc1 is published as a pre-release.
            case "$GITHUB_REF_NAME" in *-*) FLAGS+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" dist/*.apk --verify-tag --title "Watches ${GITHUB_REF_NAME#v}" "${FLAGS[@]}"
          fi
          echo "::notice::Released $GITHUB_REF_NAME: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
