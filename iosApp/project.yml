# XcodeGen spec: `cd iosApp && xcodegen generate` creates iosApp.xcodeproj (not committed).
name: iosApp
options:
  bundleIdPrefix: io.github.tunlezah
  deploymentTarget:
    iOS: "17.0"
# The version for both phones lives in ../version.xcconfig, which Android reads too.
configFiles:
  Debug: ../version.xcconfig
  Release: ../version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # iPhone only for now (docs/IOS_PLAN.md, D4).
    TARGETED_DEVICE_FAMILY: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Watches
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The design's ground colour while the app starts, in light or dark mode.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # One window: the shared code's singletons (Koin, DeepLinks, the backup coordinator) assume it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets Compose run at 120 Hz on ProMotion displays.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Take photos of your watches and their papers.
        NSFaceIDUsageDescription: Unlock Watches when the app lock is on.
        NSPhotoLibraryUsageDescription: Add photos of your watches from your library.
        # The share sheet's "Save Image" needs this: without it, saving a shared photo crashes the app.
        NSPhotoLibraryAddUsageDescription: Save a photo you share from Watches to your library.
        # HTTPS through iOS only, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tunlezah.watches
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The team comes from CI (DEVELOPMENT_TEAM=…) or from your choice in Xcode's Signing pane.
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "WatchApp"]
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:ui:embedAndSignAppleFrameworkForXcode
    scheme:
      testTargets:
        - iosAppTests
        - iosAppUITests
      gatherCoverageData: false

  # Runs inside the app on the simulator: checks what the build put in the bundle.
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tunlezah.watches.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Drives the real app through its accessibility tree, as a person would.
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tunlezah.watches.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosApp
